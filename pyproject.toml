[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "patchpilot"
version = "0.1.0"
description = "Practical orchestration of coding agents for repository tasks."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Pavel Travnicek" }
]
keywords = ["agents", "orchestration", "codex", "claude", "workflow"]

[project.scripts]
patchpilot = "patchpilot.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
